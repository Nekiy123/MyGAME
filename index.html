<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="landscape">
    <title>Sons of the Forest — Mini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="rotate-overlay">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">Поверни телефон горизонтально</div>
    </div>

    <!-- ЗАСТАВКА -->
    <div id="splash-screen">
        <div class="splash-bg"></div>
        <div class="splash-content">
            <div class="splash-logo">FOREST</div>
            <div class="splash-sub">SURVIVAL HORROR</div>
            <div class="splash-loading">Загрузка<span class="dots">...</span></div>
        </div>
        <div class="splash-footer">Нажми, чтобы начать</div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <!-- МИНИКАРТА -->
        <div id="minimap-wrap">
            <canvas id="minimap"></canvas>
            <div class="hud-circle health-circle" id="health-circle">
                <span class="hud-icon">❤️</span>
            </div>
            <div class="hud-circle hunger-circle" id="hunger-circle">
                <span class="hud-icon">🍖</span>
            </div>
            <div class="hud-circle battery-circle" id="battery-circle">
                <span class="hud-icon">🔋</span>
            </div>
            <div class="hud-circle berries-circle" id="berries-circle">
                <span class="hud-icon">🍓</span>
                <span class="hud-count" id="berries-count">0</span>
            </div>
        </div>
        
        <div id="hint"></div>
        
        <!-- ОТЛАДКА (скрыта по умолчанию) -->
        <div id="debug" style="display:none;">
            <span id="debug-text">загрузка...</span>
        </div>

        <!-- Джойстик -->
        <div id="joystick-zone">
            <div id="joystick-base"><div id="joystick-knob"></div></div>
        </div>
        
        <!-- Обзор -->
        <div id="look-zone"></div>
        
        <!-- Кнопки действий -->
        <div id="action-buttons">
            <div class="action-btn" id="jump-button">⤒</div>
            <div class="action-btn" id="collect-button">✋</div>
            <div class="action-btn" id="flashlight-button">🔦</div>
            <div class="action-btn" id="eat-button">🍓</div>
        </div>
        
        <div id="fullscreen-btn">⛶</div>
        <div id="settings-btn">⚙️</div>
        <div id="crosshair"></div>
        <div id="damage-flash"></div>
        
        <!-- НАСТРОЙКИ -->
        <div id="settings-screen">
            <div class="settings-panel">
                <div class="settings-title">НАСТРОЙКИ</div>
                
                <div class="setting-row">
                    <label>Поле зрения (FOV)</label>
                    <input type="range" id="fov-slider" min="50" max="110" value="70" step="5">
                    <span id="fov-value">70°</span>
                </div>
                
                <div class="setting-row">
                    <label>Показать координаты</label>
                    <div class="toggle" id="coords-toggle">
                        <div class="toggle-knob"></div>
                    </div>
                </div>
                
                <div class="setting-row">
                    <label>Показать прицел</label>
                    <div class="toggle" id="crosshair-toggle">
                        <div class="toggle-knob"></div>
                    </div>
                </div>
                
                <button id="settings-close">ЗАКРЫТЬ</button>
            </div>
        </div>
        
        <!-- ПОЛНАЯ КАРТА (статичная) -->
        <div id="fullmap-screen">
            <div class="fullmap-title">КАРТА ОСТРОВА</div>
            <canvas id="fullmap-canvas"></canvas>
            <div class="fullmap-hint">Нажми, чтобы закрыть</div>
        </div>
        
        <!-- Экран смерти -->
        <div id="death-screen">
            <div class="death-title">ТЫ ПОГИБ</div>
            <div class="death-reason" id="death-reason">Голод</div>
            <button id="respawn-btn">Возродиться</button>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
                </html>
