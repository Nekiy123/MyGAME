<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="landscape">
    <title>Forest — Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="rotate-overlay">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">Поверни телефон горизонтально</div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <!-- HUD -->
        <div id="hud">
            <div class="bar-container">
                <div class="bar-label">❤️</div>
                <div class="bar"><div id="health-bar" class="bar-fill health"></div></div>
            </div>
            <div class="bar-container">
                <div class="bar-label">🍖</div>
                <div class="bar"><div id="hunger-bar" class="bar-fill hunger"></div></div>
            </div>
            <div class="bar-container">
                <div class="bar-label">🔋</div>
                <div class="bar"><div id="battery-bar" class="bar-fill battery"></div></div>
            </div>
            <div id="resources">
                <span>🍓 <b id="berries">0</b></span>
            </div>
            <div id="hint"></div>
        </div>

        <!-- Джойстик -->
        <div id="joystick-zone">
            <div id="joystick-base"><div id="joystick-knob"></div></div>
        </div>
        
        <!-- Обзор -->
        <div id="look-zone"></div>
        
        <!-- Кнопки справа -->
        <div id="action-buttons">
            <div class="action-btn" id="jump-button">⤒</div>
            <div class="action-btn" id="collect-button">✋</div>
            <div class="action-btn" id="flashlight-button">🔦</div>
            <div class="action-btn" id="eat-button">🍓</div>
        </div>
        
        <div id="fullscreen-btn">⛶</div>
        <div id="crosshair"></div>
        <div id="damage-flash"></div>
        
        <!-- Экран смерти -->
        <div id="death-screen">
            <div class="death-title">ТЫ ПОГИБ</div>
            <div class="death-reason" id="death-reason">Голод</div>
            <button id="respawn-btn">Возродиться</button>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
            </html>
