<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="landscape">
    <title>Forest — Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <!-- МИНИКАРТА (слева вверху) -->
        <div id="minimap-wrap">
            <canvas id="minimap"></canvas>
            <div id="minimap-north">N</div>
        </div>
        
        <!-- HUD справа от карты: иконки + маленькие полоски -->
        <div id="hud-icons">
            <div class="hud-item">
                <span class="hud-icon">❤️</span>
                <div class="mini-bar"><div id="health-bar" class="mini-fill health"></div></div>
            </div>
            <div class="hud-item">
                <span class="hud-icon">🍖</span>
                <div class="mini-bar"><div id="hunger-bar" class="mini-fill hunger"></div></div>
            </div>
            <div class="hud-item">
                <span class="hud-icon">🔋</span>
                <div class="mini-bar"><div id="battery-bar" class="mini-fill battery"></div></div>
            </div>
            <div class="hud-item resources">
                <span>🍓 <b id="berries">0</b></span>
            </div>
        </div>

        <!-- Подсказка -->
        <div id="hint"></div>

        <!-- Джойстик -->
        <div id="joystick-zone">
            <div id="joystick-base"><div id="joystick-knob"></div></div>
        </div>
        
        <!-- Обзор -->
        <div id="look-zone"></div>
        
        <!-- Кнопки справа -->
        <div id="action-buttons">
            <div class="action-btn" id="jump-button">⤒</div>
            <div class="action-btn" id="collect-button">✋</div>
            <div class="action-btn" id="flashlight-button">🔦</div>
            <div class="action-btn" id="eat-button">🍓</div>
        </div>
        
        <div id="fullscreen-btn">⛶</div>
        <div id="crosshair"></div>
        <div id="damage-flash"></div>
        
        <!-- Экран смерти -->
        <div id="death-screen">
            <div class="death-title">ТЫ ПОГИБ</div>
            <div class="death-reason" id="death-reason">Голод</div>
            <button id="respawn-btn">Возродиться</button>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
                                          </html>
